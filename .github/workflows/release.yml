name: Release

# 触发条件：推送 v* 格式的 tag（如 v26.9.9、v1.0.0）
on:
  push:
    tags:
      - 'v*'

# 防止多个 release 并行触发
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# GITHUB_TOKEN 默认是 read-only，必须显式声明才能 push release artifacts
permissions:
  contents: write

jobs:
  # ---- 阶段 1：每个平台独立 build，仅上传到 actions artifacts ----
  # 注意：不在这里调 softprops/action-gh-release —— 多个 job 并发调它
  # 会撞竞态（release 创建竞争、文件 attach 不上）。
  # 所有 attach 由下面唯一的 publish job 一次性完成。
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 生成多尺寸 PNG 到 build/icons/ —— electron-builder 会自动从中
      # 生成 macOS .icns 和 Windows .ico。public/icon.png 必须是 512x512+，
      # 否则 macOS 会报 'image must be at least 512x512'。
      - name: Generate icons
        run: npm run icons

      # better-sqlite3 是 native module，必须针对各平台重建
      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      # 三平台前置：每台 runner 只构建对应平台，避免跨平台编译依赖
      # package.json 已配置 "publish": null 阻止 electron-builder 自动调
      # GitHub API 发布；上传由 publish job 统一负责。
      # shell: pwsh 让 Windows / macOS / Linux 都用同一脚本（bash-only 语法在
      # Windows pwsh 下会 ParserError）。
      - name: Build (Windows / macOS / Linux)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run electron:build 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "===== electron-builder failed (exit $LASTEXITCODE) ====="
            Write-Host "===== last 80 lines of build.log ====="
            Get-Content build.log -Tail 80
            Write-Host "===== full log uploaded as artifact 'build.log' ====="
            exit $LASTEXITCODE
          }
        shell: pwsh

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.deb
            release/*.rpm
          if-no-files-found: ignore
          retention-days: 30

  # ---- 阶段 2：所有平台 build 完成后，单 job 合并产物并发布 release ----
  publish:
    name: Publish to GitHub Release
    runs-on: ubuntu-latest
    needs: build   # 等所有 3 个 build job 全部 success
    if: success()  # 任何 build 失败就跳过 publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          # merge-multiple 让多个 build job 的 artifacts 解压到同一目录
          # （每个 artifact 解压到 dist/installer-{os}/ 子目录）
          merge-multiple: true

      # 显式列出所有文件——glob 错的时候日志一眼能看出问题
      - name: List downloaded installers
        run: |
          echo "=== dist/ tree ==="
          ls -laR dist/
          echo "=== installers found ==="
          find dist/ -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \) -print
          echo "=== count ==="
          find dist/ -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \) | wc -l

      # 防御：如果一个 installer 都没下到，直接 fail 而不是静默空 release
      - name: Verify installers exist
        run: |
          count=$(find dist/ -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \) | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No installer files found in downloaded artifacts"
            exit 1
          fi
          echo "Found $count installer files"

      # 绕开 softprops/action-gh-release 的静默失败问题：
      # v26.9.9 / v26.9.10 两次都报 success 但 release 不存在（repo 0 releases）。
      # 改用 bash + curl 直接调 GitHub REST API 创建 release + 上传 asset。
      # 流程：创建 draft release（拿到 upload_url）→ 逐个上传文件 → done
      - name: Create release and attach installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Step 1: Create draft release for ${TAG} ==="
          create_payload=$(cat <<JSON
          {
            "tag_name": "${TAG}",
            "target_commitish": "${TAG}",
            "name": "AI WorkHub ${TAG}",
            "body": "## AI WorkHub ${TAG}\n\nCross-platform desktop AI office companion (Electron + Pi SDK).\n\n**Installers in this release:**\n- 🪟 Windows: \`AI-WorkHub-1.0.0.exe\`\n- 🍎 macOS (x64 + arm64): \`AI-WorkHub-1.0.0.dmg\`\n- 🐧 Linux (Ubuntu 22.04+): \`AI-WorkHub-1.0.0.AppImage\`\n\nSee README for installation instructions and SHA256 checksums.",
            "draft": true,
            "generate_release_notes": false
          }
          JSON
          )

          create_response=$(curl -sS -w "\n%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "${create_payload}" \
            "https://api.github.com/repos/${REPO}/releases")

          create_body=$(echo "${create_response}" | head -n -1)
          create_code=$(echo "${create_response}" | tail -n 1)

          echo "POST /releases HTTP ${create_code}"
          if [ "${create_code}" != "201" ]; then
            echo "::error::Failed to create release (HTTP ${create_code})"
            echo "${create_body}"
            exit 1
          fi

          upload_url=$(echo "${create_body}" | python -c "import json,sys; print(json.load(sys.stdin)['upload_url'])")
          release_id=$(echo "${create_body}" | python -c "import json,sys; print(json.load(sys.stdin)['id'])")
          release_html=$(echo "${create_body}" | python -c "import json,sys; print(json.load(sys.stdin)['html_url'])")
          echo "Created release id=${release_id} html=${release_html}"
          echo "Upload URL template: ${upload_url}"

          echo ""
          echo "=== Step 2: Upload installers ==="
          shopt -s nullglob
          files=(
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.AppImage
            dist/**/*.zip
            dist/**/*.deb
            dist/**/*.rpm
          )
          shopt -u nullglob

          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installer files found under dist/"
            exit 1
          fi

          echo "Found ${#files[@]} files to upload:"
          printf '  - %s\n' "${files[@]}"

          # upload_url 形如 https://uploads.github.com/repos/.../releases/{id}/assets{?name,label}
          # 需要剥掉 {...} 模板部分
          upload_url=$(echo "${upload_url}" | sed 's/{[^}]*}//g')

          for file in "${files[@]}"; do
            name=$(basename "${file}")
            echo ""
            echo "Uploading ${name} ..."

            # curl --data-binary @file 上传文件本体
            upload_response=$(curl -sS -w "\n%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}" \
              "${upload_url}?name=${name}")

            upload_body=$(echo "${upload_response}" | head -n -1)
            upload_code=$(echo "${upload_response}" | tail -n 1)

            echo "  HTTP ${upload_code}"
            if [ "${upload_code}" != "201" ]; then
              echo "::error::Failed to upload ${name} (HTTP ${upload_code})"
              echo "${upload_body}"
              exit 1
            fi
            asset_id=$(echo "${upload_body}" | python -c "import json,sys; print(json.load(sys.stdin)['id'])")
            asset_size=$(echo "${upload_body}" | python -c "import json,sys; print(json.load(sys.stdin)['size'])")
            echo "  ✔ uploaded id=${asset_id} size=${asset_size}"
          done

          echo ""
          echo "=== Done — draft release ready at: ==="
          echo "  ${release_html}"