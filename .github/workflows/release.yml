name: Release

# 触发条件：推送 v* 格式的 tag（如 v26.9.1、v1.0.0）
on:
  push:
    tags:
      - 'v*'

# 防止多个 release 并行触发
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 三平台独立 build，失败一个不影响其他
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # better-sqlite3 是 native module，必须针对各平台重建
      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      # 三平台前置：Linux 需要 wine/dpkg 才能 build Windows + mac targets
      # 但目前我们只在每台 runner 上构建对应平台，避免跨平台编译
      # package.json 已配置 "publish": null 阻止 electron-builder 自动调 GitHub API；
      # 发布由下方的 softprops/action-gh-release@v2 统一负责。
      # shell: 在 Windows runner 上用 pwsh（默认 shell 不支持 bash-only 语法）
      - name: Build (Windows / macOS / Linux)
        env:
          # 跳过 macOS 公证（个人项目无 Apple Developer 证书；正式签名时移除）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Windows 跳过代码签名（个人项目无证书；正式签名时设置 WIN_CSC_LINK）
          # 不显式传空值——electron-builder 默认就不会签名
        run: |
          npm run electron:build 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "===== electron-builder failed (exit $LASTEXITCODE) ====="
            Write-Host "===== last 80 lines of build.log ====="
            Get-Content build.log -Tail 80
            Write-Host "===== full log uploaded as artifact 'build.log' ====="
            exit $LASTEXITCODE
          }
        shell: pwsh

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-workhub-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
          if-no-files-found: ignore

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true              # 先 draft（手动检查再发布）
          # generate_release_notes 调用的 /releases/generate-notes API 需要
          # workflows:write 权限。默认 GITHUB_TOKEN 只有 contents:write，
          # 会撞 403 "Resource not accessible by integration"。手动写 notes 即可。
          generate_release_notes: false
          # 留空 body——发布前在 GitHub UI 上手动填 release notes
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
